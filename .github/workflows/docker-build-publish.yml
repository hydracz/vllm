# 构建 x86 CUDA vllm-openai 镜像并发布到 ghcr.io
# 触发: 推送 florence-v* 或 v* 标签时

name: Build and Push Docker Image

on:
  push:
    tags:
      - 'florence-v*'
      - 'v*'
  workflow_dispatch:  # 允许手动触发

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # CUDA 编译耗时较长，最多 4 小时
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: |
          ref="$GITHUB_REF"
          if [[ "$ref" == refs/tags/* ]]; then
            echo "version=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: vllm-openai
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vllm-openai:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vllm-openai:latest
          build-args: |
            max_jobs=4
            nvcc_threads=2
            torch_cuda_arch_list=8.0 8.9 9.0 10.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false  # 简化镜像，兼容更多运行时
